design_docs:
  - key: usage_insights
    title: Customer Usage Insights service
    team: Digital Channels
    apps: [MyNorthGrid Portal, CustomerOne CIS, MeterSense MDM]
    components: [Usage Insights API, Insights Worker, CIS billing database, OpenMind Studio LLM, Mobile App]
    violations: [STD-INT-02, STD-AI-01, STD-DATA-01, STD-INT-04]
    body: |
      ## Summary
      We propose a Customer Usage Insights service that shows customers personalised explanations of their bills and usage in the portal and mobile app.

      ## Design
      The Insights Worker will use a read-only account on the CIS billing database to pull bill history and tariff details, and will query the MDM interval tables nightly for the last 13 months of usage. A direct database connection keeps the build simple and avoids waiting for the Customer API Layer project.

      Narrative explanations will be generated with OpenMind Studio, a generative AI vendor the team trialled during a hackathon. Prompts will include the customer's name, address and usage history.

      The Usage Insights API will be exposed to the mobile app through the existing API gateway.

      ## Non-functional
      Target response time 800 ms. Cached results refreshed nightly.
  - key: outage_eta
    title: Real-time Outage ETA for Customers
    team: Outage Systems
    apps: [OutageWorks OMS, Outage Map Portal, DispatchPro]
    components: [ETA Service, OMS, DispatchPro, Crew Location Service, Weather Service, Outage Map Portal]
    violations: [STD-NFR-03]
    body: |
      ## Summary
      Provide customers with a live estimated restoration time on the outage map and in notifications.

      ## Design
      Data classification: outage and crew location data is classified as internal; customer contact details are confidential and not used by this service.

      For every page view the portal calls the ETA Service synchronously. The real-time path is a synchronous chain: Outage Map Portal -> ETA Service -> OMS -> DispatchPro -> Crew Location Service -> Weather Service. Each hop is a blocking REST call so customers always see the freshest estimate.

      All APIs are published through the API gateway with OAuth2.

      ## Non-functional
      Peak load during storms is 40,000 requests per minute.
  - key: veg_imagery
    title: Vegetation Imagery Ingestion
    team: Vegetation Analytics
    apps: [CanopyIQ, SkyInspect Drone Platform, NorthGrid Data Lake]
    components: [Drone Platform, Imagery Bucket, CanopyIQ, Data Lake]
    violations: [STD-DATA-01, STD-TECH-02]
    body: |
      ## Summary
      Land drone and satellite imagery in the data lake so CanopyIQ and the wildfire model can use it.

      ## Design
      SkyInspect uploads imagery to a new storage bucket in the analytics account. The bucket and its processing cluster were provisioned manually in the console for the pilot and will be kept for production. CanopyIQ pulls new imagery via its connector every night.

      ## Non-functional
      Approximately 4 TB per month during inspection season.
  - key: scada_analytics
    title: SCADA Telemetry Analytics in the Cloud
    team: Grid Analytics
    apps: [GridHistorian, NorthGrid Data Lake, LoadCast Forecasting]
    components: [GridHistorian, Cloud Ingest Agent, Data Lake, LoadCast]
    violations: [STD-OT-01, STD-INT-02]
    body: |
      ## Summary
      Stream SCADA telemetry to the cloud data lake for load forecasting and asset analytics.

      ## Design
      Data classification: SCADA telemetry is restricted (BES Cyber System Information).

      A cloud ingest agent installed on the IT network will connect directly to the GridHistorian in the OT zone and use a direct database read of the historian archive tables every five minutes. This avoids the cost of the OT DMZ replica.

      ## Non-functional
      Five-minute latency is acceptable for forecasting.
  - key: crm_chat
    title: Contact Center Chatbot on CRM
    team: Customer Care
    apps: [Nimbus CRM, ContactPoint Contact Center]
    components: [Chat Widget, Nimbus CRM, ChatAssist Pro, Knowledge Base]
    violations: [STD-AI-01, STD-AI-03, STD-AI-02]
    body: |
      ## Summary
      Launch a customer chatbot on the website that answers billing questions and can approve payment extensions.

      ## Design
      Data classification: customer account data is confidential.

      The bot will use ChatAssist Pro, which some agents already use. Payment extensions up to $500 will be a fully automated decision without human review. We will skip the model registry for the pilot because it is a vendor product, and there will be no formal evaluation before launch.

      The widget calls the CRM through the API gateway with OAuth2.
  - key: der_portal
    title: DER Interconnection Portal v2
    team: Grid Modernization
    apps: [DER Interconnect Portal, GeoGrid GIS, DERMS Orchestrator]
    components: [Portal, Screening Service, Network Model Service, DER Registry API]
    violations: []
    body: |
      ## Summary
      Automate screening of small solar and storage interconnection requests against the network model.

      ## Design
      Data classification: applicant contact details are confidential; network model data is confidential; screening results are internal.

      The Screening Service calls the Network Model Service and DER Registry API through the API gateway using OAuth2. Applicants sign in with the customer identity platform. Requests and decisions are published as events for DERMS.

      Engineers review every screening result before an approval is issued.

      ## Non-functional
      Infrastructure is defined in Terraform. Logs ship to the observability platform.
  - key: field_offline
    title: Offline Maps for Field Crews
    team: Field Systems
    apps: [GeoGrid Field Viewer, FieldForce Mobile]
    components: [Field Viewer, Map Tile Service, FieldForce Mobile]
    violations: []
    body: |
      ## Summary
      Provide offline network maps in FieldForce Mobile using GeoGrid Field Viewer tiles.

      ## Design
      Data classification: network maps are confidential and encrypted on device.

      Tiles are generated nightly by the Map Tile Service and downloaded through the API gateway. Crews authenticate with the enterprise identity platform.
  - key: payments_v2
    title: Payment Tokenization Upgrade
    team: Customer Payments
    apps: [PayBridge Gateway, MyNorthGrid Portal]
    components: [Portal, PayBridge Gateway, Token Vault]
    violations: []
    body: |
      ## Summary
      Replace stored card references with gateway tokens.

      ## Design
      Data classification: cardholder data is restricted and never leaves PayBridge; the portal stores tokens only (internal).

      The portal calls the Payment API through the API gateway with OAuth2 and mTLS. Infrastructure is defined as code.
  - key: transformer_ml
    title: Transformer Failure Prediction to Production
    team: Asset Analytics
    apps: [TransformerIQ, AssetWorks EAM, ModelHub ML Platform]
    components: [Feature Pipeline, ModelHub, Batch Scoring, AssetWorks EAM]
    violations: []
    body: |
      ## Summary
      Move the transformer failure model from pilot to production with weekly batch scoring written back to EAM as work requests.

      ## Design
      Data classification: DGA readings and asset data are internal.

      The model is registered in ModelHub with an evaluation report. Scores are written to EAM through the Work Order API via the gateway. Planners review every generated work request.
  - key: regulatory_rag
    title: Regulatory Filing Assistant
    team: Regulatory Affairs
    apps: [FileReg Regulatory Filing]
    components: [Filing Assistant, Vector Index, Azure OpenAI, Filings Archive]
    violations: []
    body: |
      ## Summary
      Draft first versions of routine regulatory filings from prior filings and data requests.

      ## Design
      Data classification: prior filings are public; draft filings are internal until submitted.

      The assistant uses retrieval over the filings archive and Azure OpenAI from the approved GenAI list. Outputs are logged and evaluated against a reviewed test set. Analysts edit and approve every draft.
  - key: hr_analytics
    title: Workforce Analytics Copy to Test
    team: HR Technology
    apps: [Workwell HRIS, NorthGrid Data Lake]
    components: [HRIS Export, Data Lake Test Zone, Lumen BI]
    violations: [STD-DATA-02]
    body: |
      ## Summary
      Build workforce dashboards in the test environment before go-live.

      ## Design
      Data classification: employee records are restricted.

      We will copy the full production employee extract into the test zone of the data lake so analysts can build dashboards with realistic data. Data will be unmasked to keep joins working.
  - key: trading_api
    title: Market Price Feed for Partners
    team: Energy Trading
    apps: [TradeVolt ETRM]
    components: [Price Feed Service, TradeVolt ETRM, Partner Systems]
    violations: [STD-API-02, STD-API-03]
    body: |
      ## Summary
      Share hourly market price curves with two community choice aggregators.

      ## Design
      Data classification: price curves are confidential.

      The Price Feed Service will be exposed directly to the internet without the gateway, and partners authenticate with a static API key shared by email.
  - key: eam_upgrade
    title: EAM Mobile Inspection Forms
    team: Asset Systems
    apps: [AssetWorks EAM, InspectPro Field]
    components: [EAM, Inspection Forms Service, InspectPro]
    violations: []
    body: |
      ## Summary
      Standardise inspection forms in EAM and retire duplicate forms in InspectPro.

      ## Design
      Data classification: inspection data is internal.

      Forms are published as events; InspectPro consumes them via the API gateway with OAuth2. Infrastructure as code.

decisions:
  - key: d1
    channel: "#arch-integration"
    title: Use events for meter reads instead of MDM polling
    context: Three consumers poll MDM interval tables every 15 minutes, causing lock contention during billing runs.
    options: [Keep polling with read replicas, Publish meter read events from MDM, Nightly batch extract]
    decision: Publish meter read events from MDM on the enterprise event broker; consumers subscribe.
    consequences: Consumers must migrate within two quarters; MDM team owns the event schema.
    apps: [MeterSense MDM, NorthGrid Data Lake, RevGuard Theft Analytics]
  - key: d2
    channel: "#outage-modernization"
    title: Replace StormTrack with OMS storm module
    context: StormTrack duplicates OMS restoration planning and runs on an unsupported .NET framework.
    options: [Rebuild StormTrack, Adopt OMS storm module after upgrade, Buy a standalone storm tool]
    decision: Adopt the OMS storm module as part of the OMS upgrade and retire StormTrack.
    consequences: Storm playbooks must be re-created in OMS; dependency on OMS upgrade timeline.
    apps: [StormTrack Restoration Planner, OutageWorks OMS]
  - key: d3
    channel: "#digital-channels"
    title: Single customer API layer in front of CIS
    context: Portal, mobile app and IVR each integrate with CIS differently, causing inconsistent balances.
    options: [Point-to-point per channel, Customer API layer on the gateway, Replicate CIS to a channel database]
    decision: Build a customer API layer on the API gateway; all channels consume it.
    consequences: Channels migrate over three releases; CIS team exposes stable services.
    apps: [CustomerOne CIS, MyNorthGrid Portal, NorthGrid Mobile App, VoiceFirst IVR]
  - key: d4
    channel: "#ot-security"
    title: OT data leaves only via DMZ historian replica
    context: Several IT systems read OT historian and ADMS data directly, which the last CIP audit flagged.
    options: [Firewall rules per consumer, DMZ historian replica with data diode, Stop sharing OT data]
    decision: Stand up a DMZ historian replica fed by a data diode; IT consumers read only from the replica.
    consequences: Existing direct links from EDW and LoadCast must be removed by end of quarter.
    apps: [GridHistorian, Terabase EDW, LoadCast Forecasting]
  - key: d5
    channel: "#data-platform"
    title: Standardise BI on Lumen BI
    context: Two BI tools with overlapping dashboards; Vizora usage has fallen below 20% of licensed seats.
    options: [Keep both, Standardise on Lumen BI, Standardise on Vizora]
    decision: Standardise on Lumen BI and let the Vizora contract lapse at renewal.
    consequences: Migrate 40 Vizora dashboards; cancel auto-renewal notice before deadline.
    apps: [Lumen BI, Vizora Analytics]
  - key: d6
    channel: "#genai-cop"
    title: Approved GenAI platforms for pilots
    context: Teams are trialling several GenAI vendors with customer data.
    options: [Allow any vendor with a DPA, Approve a short list of platforms, Ban GenAI]
    decision: Pilots must use Azure OpenAI, Bedrock or Anthropic Claude through the platform team.
    consequences: Shadow GenAI subscriptions to be cancelled; exception process for others.
    apps: [ModelHub ML Platform]
  - key: d7
    channel: "#field-systems"
    title: Consolidate field inspection apps on InspectPro
    context: InspectPro and SafeCheck both capture inspections; crews use both.
    options: [Keep both, InspectPro only, SafeCheck only]
    decision: Consolidate on InspectPro Field and retire SafeCheck at contract end.
    consequences: Migrate 60 form templates; train 95 SafeCheck users.
    apps: [InspectPro Field, SafeCheck Inspections]
  - key: d8
    channel: "#docs-migration"
    title: Retire Legacy DocuVault into TeamSpace Docs
    context: DocuVault reaches vendor end of support in five months; content is duplicated in TeamSpace and RecordsOne.
    options: [Extend support, Migrate to TeamSpace Docs, Migrate to RecordsOne ECM]
    decision: Migrate active content to TeamSpace Docs and records to RecordsOne retention policies, then retire DocuVault.
    consequences: Records team validates retention mapping; read-only archive for 12 months.
    apps: [Legacy DocuVault, TeamSpace Docs, RecordsOne ECM]

