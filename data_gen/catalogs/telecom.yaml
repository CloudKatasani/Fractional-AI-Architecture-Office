extra_standards:
  - id: STD-TMF-01
    title: TM Forum Open API alignment for BSS
    domain: api
    severity: medium
    rule_text: New or changed BSS APIs conform to the relevant TM Forum Open API (e.g. TMF620, TMF622, TMF632, TMF678).
    checks:
      - {type: pattern_any, patterns: ["custom (soap|xml) (interface|api)", "proprietary api"]}
  - id: STD-INT-05
    title: Event-driven order-to-activate
    domain: integration
    severity: medium
    rule_text: Order-to-activate steps communicate through order and service events with an orchestrated saga; no batch hand-offs.
    checks:
      - {type: pattern_any, patterns: ["nightly batch .{0,40}(activation|provisioning|order)"]}
  - id: STD-BSS-01
    title: No shared database between BSS and OSS
    domain: integration
    severity: critical
    rule_text: BSS and OSS applications never share database schemas or DB links. Exchange data through TMF APIs or events.
    checks:
      - {type: pattern_any, patterns: ["shared (oracle )?(database|schema)", "(oss|inventory|provisioning) .{0,40}(database|tables) directly"]}
  - id: STD-RES-01
    title: Subscriber data residency
    domain: data
    severity: critical
    rule_text: Subscriber personal data and CPNI are stored and processed only in the home region (eu-central-1) or approved in-country facilities.
    checks:
      - {type: pattern_any, patterns: ["us-east-1", "outside the (eu|home region)", "offshore"]}
  - id: STD-AI-04
    title: Model registry mandatory for production AI
    domain: ai
    severity: high
    rule_text: No AI model serves production traffic unless registered in ModelHub with an approved risk tier.
    checks: []

extra_patterns:
  - id: PAT-10
    name: BSS/OSS Decoupling via TMF Events
    when_to_use: BSS needs OSS status (or vice versa) without sharing databases.
    keywords: [bss, oss, inventory, provisioning, service status, activation, tmf, decouple, order-to-activate]
    nfrs: [decoupling, consistency]
    components: [BSS Application, TMF Open API, Event Broker, OSS Application, Service Inventory]
    standard_ids: [STD-BSS-01, STD-TMF-01, STD-INT-05]
    diagram_mermaid: |
      flowchart LR
        BSS[BSS App] -->|TMF622 Order| OM[Order Orchestrator]
        OM -->|TMF640 Activation| OSS[OSS Activation]
        OSS --> SI[(Service Inventory)]
        SI -->|service events| B{{Event Broker}}
        B --> BSS

extra_policies:
  - id: POL-20
    title: CPNI not used for marketing without consent
    rule: Datasets tagged CPNI may feed marketing tools only when consent is recorded and a data contract exists.
    regulation: Telecom customer privacy law (CPNI)
    severity: high
    check: {type: cpni_marketing}
  - id: POL-21
    title: Subscriber data residency
    rule: Datasets containing subscriber PII must reside in eu-central-1.
    regulation: Data residency for subscriber data
    severity: critical
    check: {type: residency, tag: subscriber_pii, region: eu-central-1}
  - id: POL-22
    title: Cardholder data limited to PCI zone
    rule: PCI-tagged datasets may be stored only in PCI-scoped systems and must not be copied to the data lake.
    regulation: PCI DSS
    severity: critical
    check: {type: pci_scope, tag: pci}
  - id: POL-23
    title: Lawful intercept data retention limit
    rule: Lawful intercept datasets are retained no longer than 365 days and never leave the LI system.
    regulation: Lawful intercept data handling
    severity: critical
    check: {type: retention_max, tag: lawful_intercept, days: 365}
  - id: POL-24
    title: Number portability records retained 2 years
    rule: Number portability records are retained for at least 730 days.
    regulation: Number portability obligations
    severity: medium
    check: {type: retention_min, tag: mnp, days: 730}
  - id: POL-25
    title: Subscriber PII retention limit
    rule: Subscriber personal data may not be kept longer than 1095 days after contract end.
    regulation: GDPR-like data protection law
    severity: high
    check: {type: retention_max, pii: true, domains: [Subscriber, Usage, Care, Marketing], days: 1095}
  - id: POL-26
    title: PII masked in non-production
    rule: Personal data copied to non-production must be masked.
    regulation: GDPR-like data protection law
    severity: high
    check: {type: masking_nonprod}

