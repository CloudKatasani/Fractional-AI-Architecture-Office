# NorthGrid Energy — electric and gas utility (synthetic). Hand-authored industry catalog.
tenant:
  id: northgrid
  name: NorthGrid Energy
  industry: Electric and gas utility, 2.1M customers, regulated
  employees: 4800
  it_spend_usd: 95000000
  notes: Mix of on-prem OT and cloud IT; NERC CIP applies to OT; SAP IS-U style CIS for billing
  boundary_label: IT/OT
  approved_regions: [us-east-1, us-east-2, us-west-2]
  home_region: us-east-1
  email_domain: northgrid.example
  cost_center_prefix: NG

users:
  - {key: pa, name: Avery Lindqvist, role: principal_architect, title: Principal Architect (Fractional Architecture Office)}
  - {key: cio, name: Dana Okafor, role: cio, title: Chief Information Officer}
  - {key: own_grid, name: Marcus Feld, role: app_owner, title: Director, Grid Operations Technology}
  - {key: own_cust, name: Priya Raman, role: app_owner, title: Director, Customer Systems}
  - {key: own_asset, name: Tomasz Wierzbicki, role: app_owner, title: Director, Asset & Field Systems}
  - {key: own_corp, name: Elena Marsh, role: app_owner, title: Manager, Corporate Applications}
  - {key: own_data, name: Jordan Achebe, role: app_owner, title: Manager, Analytics Platforms}
  - {key: sec, name: Hannah Voss, role: security_architect, title: Lead Security Architect, IT/OT}
  - {key: dgl, name: Samuel Ortiz, role: data_governance_lead, title: Data Governance Lead}
  - {key: risk, name: Grace Mbeki, role: risk_officer, title: Chief Risk & Compliance Officer}
  - {key: tl, name: Leo Brandt, role: tech_lead, title: Engineering Lead, Digital Platforms}

# Owner assignment for applications/datasets by L1 capability
owner_by_l1:
  Generation Management: own_grid
  Transmission & Distribution Operations: own_grid
  Grid Modernization: own_grid
  Asset Management: own_asset
  Outage Management: own_grid
  Metering & Meter Data: own_cust
  Customer Service & Billing: own_cust
  Energy Trading & Settlement: own_corp
  Regulatory Compliance & Reporting: own_corp
  Field Workforce Management: own_asset
  Vegetation Management: own_asset
  Safety & Environmental: own_asset
  Corporate: own_corp
  Enterprise Data & Analytics: own_data
  Cybersecurity (IT/OT): sec

capabilities:
  - name: Generation Management
    importance: 3
    maturity: 3
    keywords: [generation, plant, dispatch, fuel, renewable]
    children:
      - {name: Plant Operations, children: [Unit Dispatch, Plant Maintenance]}
      - {name: Fuel Management}
      - {name: Renewable Asset Performance, maturity: 2}
  - name: Transmission & Distribution Operations
    importance: 5
    maturity: 3
    keywords: [grid, scada, ems, distribution, transmission, switching, substation, control room]
    children:
      - {name: Grid Control & SCADA, maturity: 4, children: [Energy Management, Distribution Management]}
      - {name: Switching & Clearance}
      - {name: Substation Operations}
  - name: Grid Modernization
    importance: 5
    maturity: 2
    keywords: [modernization, der, distributed energy, demand response, automation, ev, smart grid, decarbonization]
    children:
      - {name: DER Integration, maturity: 1, children: [DER Forecasting, DER Control]}
      - {name: Demand Response}
      - {name: Advanced Distribution Automation}
  - name: Asset Management
    importance: 4
    maturity: 3
    keywords: [asset, transformer, maintenance, work order, inspection, reliability, condition]
    children:
      - {name: Asset Registry & Health, children: [Transformer Health]}
      - {name: Work Management}
      - {name: Inspection Management, maturity: 2}
  - name: Outage Management
    importance: 5
    maturity: 2
    keywords: [outage, restoration, storm, reliability, saidi, saifi, trouble call]
    children:
      - {name: Outage Detection & Restoration, maturity: 2, children: [Storm Response]}
      - {name: Outage Communications, maturity: 2}
      - {name: Reliability Reporting}
  - name: Metering & Meter Data
    importance: 4
    maturity: 3
    keywords: [meter, ami, interval, mdm, usage, metering, theft]
    children:
      - {name: AMI Operations}
      - {name: Meter Data Management, children: [Revenue Protection]}
      - {name: Meter-to-Cash Validation}
  - name: Customer Service & Billing
    importance: 4
    maturity: 3
    keywords: [customer, billing, bill, portal, contact center, payment, experience, rate, tariff, digital]
    children:
      - {name: Billing & Rates, children: [Rate Case Modeling]}
      - {name: Customer Contact}
      - {name: Digital Customer Channels, maturity: 2}
      - {name: Payments & Collections}
  - name: Energy Trading & Settlement
    importance: 3
    maturity: 3
    keywords: [trading, settlement, market, energy price, risk position]
    children:
      - {name: Trading & Risk}
      - {name: Settlement}
  - name: Regulatory Compliance & Reporting
    importance: 4
    maturity: 2
    keywords: [regulatory, compliance, puc, filing, nerc, cip, rate case, mandate]
    children:
      - {name: Regulatory Filings}
      - {name: Compliance Management, children: [NERC CIP Compliance]}
  - name: Field Workforce Management
    importance: 4
    maturity: 2
    keywords: [field, crew, dispatch, workforce, mobile, technician, scheduling]
    children:
      - {name: Crew Dispatch & Scheduling}
      - {name: Mobile Field Execution}
  - name: Vegetation Management
    importance: 5
    maturity: 2
    keywords: [vegetation, wildfire, tree, encroachment, right-of-way, fire, imagery]
    children:
      - {name: Vegetation Inspection, maturity: 2}
      - {name: Wildfire Risk Mitigation, maturity: 1}
  - name: Safety & Environmental
    importance: 4
    maturity: 3
    keywords: [safety, environmental, incident, emissions, hse]
    children:
      - {name: Safety Incident Management}
      - {name: Environmental Compliance}
  - name: Corporate
    importance: 2
    maturity: 4
    keywords: [finance, hr, procurement, erp, collaboration, documents, payroll]
    children:
      - {name: Finance & ERP}
      - {name: Human Resources}
      - {name: Procurement}
      - {name: Document & Collaboration, maturity: 2}
      - {name: Project & Portfolio Management}
  - name: Enterprise Data & Analytics
    importance: 4
    maturity: 2
    keywords: [data, analytics, bi, warehouse, lake, ai, reporting, governance]
    children:
      - {name: Data Platform}
      - {name: Business Intelligence}
      - {name: Data Governance, maturity: 1}
      - {name: AI & Machine Learning, maturity: 1}
  - name: Cybersecurity (IT/OT)
    importance: 5
    maturity: 3
    keywords: [security, identity, siem, ot security, cyber, access]
    children:
      - {name: Identity & Access}
      - {name: Security Monitoring}
      - {name: OT Security, maturity: 2}
      - {name: Integration & API Management}

