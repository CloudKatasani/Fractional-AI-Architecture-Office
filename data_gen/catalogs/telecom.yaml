strategy_docs:
  - key: fiveg
    title: 5G Monetization Strategy
    type: strategy
    year: 2025
    paragraphs:
      - Meridian has invested more than one billion dollars in 5G spectrum and standalone core. Average revenue per user has not yet moved, and the board expects 5G-specific revenue of 8% of service revenue by 2028.
      - Monetisation depends on three capabilities we do not fully have today. A unified product catalog that can launch network-slice and speed-tier offers in days, not months. Real-time charging that can rate 5G usage and enterprise SLAs. And network APIs exposed to partners and enterprises through a secured gateway.
      - We will launch consumer speed tiers, fixed wireless access and private 5G for enterprises. Each requires order-to-activate automation across BSS and OSS and a single view of the customer across consumer and business lines.
      - Measures are 5G revenue share, time-to-market for new offers, and the number of enterprise private network customers.
  - key: bss
    title: BSS Consolidation Program
    type: strategy
    year: 2025
    paragraphs:
      - Following the Coastline merger, Meridian runs two billing systems, two product catalogs, two CRMs and a legacy mediation platform alongside the new 5G mediation. Running cost of the duplicated BSS estate is estimated at 18 million dollars a year and every new offer must be configured twice.
      - The program will migrate Coastline subscribers onto Meridian Convergent Billing, consolidate product catalogs on OfferHub with TM Forum Open APIs, and retire the legacy mediation platform before vendor support ends.
      - Integration between BSS and OSS today includes shared database links that block upgrades. The target architecture uses TMF Open APIs and events only.
      - Success is measured by legacy systems retired, run-cost reduction and time to launch a new tariff.
  - key: digital
    title: Digital-First Customer Experience
    type: strategy
    year: 2024
    paragraphs:
      - Customers want to buy, manage and get help entirely in the app. Today only 38% of sales and 45% of care interactions are digital and many journeys hand off to stores or the contact center.
      - We will deliver end-to-end digital journeys for plan changes, device upgrades and fault reporting, with a conversational assistant that can complete transactions. Any AI used in customer channels will disclose its use and keep a human escalation path.
      - Personalisation will use consented data only, in line with the privacy law and CPNI rules.
  - key: autonomy
    title: Network Autonomy Roadmap
    type: strategy
    year: 2026
    paragraphs:
      - We aim for TM Forum autonomous network level 3 in RAN and core by 2028. This requires closed-loop assurance, intent-based configuration and AI that can recommend and, with appropriate safeguards, execute remediation actions.
      - Self-healing actions that affect network availability will be introduced gradually with human approval, full audit logging and rollback, and treated as high risk until proven.
      - RAN energy saving is the first priority use case, targeting 12% energy reduction.
  - key: okrs
    title: FY2026 Enterprise OKRs
    type: OKR
    year: 2026
    paragraphs:
      - "Objective 1: Grow 5G revenue. Key results: 5G revenue share 4%; 3 new 5G offers launched; 25 private network customers."
      - "Objective 2: One Meridian BSS. Key results: legacy mediation retired; 50% of Coastline subscribers migrated; one product catalog."
      - "Objective 3: Digital first. Key results: digital sales 50%; chatbot containment 40%; NPS +6."
      - "Objective 4: Run lean. Key results: IT run cost down 7%; zero unregistered production AI; all subscriber data in-region."
  - key: board_ai
    title: Board Paper — AI Risk and Opportunity
    type: board_paper
    year: 2026
    paragraphs:
      - AI already drives churn retention, fraud prevention and network operations. Generative AI tools are being adopted rapidly across marketing, legal and sales, several paid by expense claim and not registered.
      - We recommend adopting EU AI Act-style risk tiers, a single model registry, and mandatory human oversight for AI that affects individuals' credit, prices or contracts. Emotion recognition of employees will be prohibited.
  - key: regulator
    title: Regulator Consultation — AI in Credit Decisions
    type: regulatory_mandate
    year: 2026
    paragraphs:
      - The telecom regulator is consulting on rules that would ban fully automated credit decisions at activation and require operators to explain adverse decisions, offer human review and test models for bias annually.
      - Operators would be required to register credit-scoring models and report decision statistics by customer segment. Meridian's activation credit scorecard would fall within scope.

