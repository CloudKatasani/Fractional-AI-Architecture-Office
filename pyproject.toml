[project]
name = "arch-office"
version = "1.0.0"
description = "Fractional AI Architecture Office — demo-grade prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "faker>=24",
  "rapidfuzz>=3.6",
  "networkx>=3.2",
  "anthropic>=0.40",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.8"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
files = ["backend/app", "data_gen"]

[tool.coverage.run]
source = ["backend/app/agents", "backend/app/kg", "data_gen"]

[tool.ruff.lint.per-file-ignores]
# place() is a closure used only within the same loop iteration
"backend/app/agents/enterprise/roadmap_drafter.py" = ["B023"]
