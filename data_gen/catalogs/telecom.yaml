design_docs:
  - key: service_status
    title: Service Status in Care Desktop
    team: Care Platforms
    apps: [Helios CRM Consumer, NetInventory OSS]
    components: [Care Desktop, Helios CRM, NetInventory OSS database]
    violations: [STD-BSS-01, STD-INT-02, STD-DATA-01]
    body: |
      ## Summary
      Show live service and outage status for a customer in the care desktop.

      ## Design
      The CRM will query the NetInventory OSS database tables directly through the existing shared Oracle database link, joining service instances to the customer record. This is faster than building an API.

      ## Non-functional
      Agents expect results in under two seconds.
  - key: nbo_launch
    title: Next-Best-Offer in App
    team: Marketing Technology
    apps: [Unity CDP, Meridian App, OfferHub Product Catalog]
    components: [NBO Engine, Unity CDP, Meridian App, PromptForge]
    violations: [STD-AI-01, STD-AI-03, STD-RES-01, STD-AI-02]
    body: |
      ## Summary
      Present personalised offers and prices in the app based on usage and segment.

      ## Design
      Data classification: subscriber usage is confidential CPNI.

      The NBO engine in Unity CDP selects the offer and discount for each subscriber as a fully automated pricing decision. Offer copy is generated by PromptForge. Model training runs in the vendor's us-east-1 tenancy, outside the home region. There will be no formal evaluation for the pilot.
  - key: billing_migration
    title: Coastline to Convergent Billing Migration Approach
    team: BSS Consolidation
    apps: [Coastline Billing (Legacy), Meridian Convergent Billing]
    components: [Migration Factory, Coastline Billing, Convergent Billing, Reconciliation Service]
    violations: []
    body: |
      ## Summary
      Migrate Coastline subscribers in four waves using a migration factory with automated reconciliation.

      ## Design
      Data classification: subscriber and invoice data is confidential; card data is restricted and remains in the payment gateway.

      Extraction uses the vendor export API; loads use Convergent Billing bulk TMF APIs. Reconciliation compares invoices for two cycles before cut-over. Infrastructure is defined in Terraform.
  - key: activation_flags
    title: Faster Activation Flags
    team: Order-to-Activate
    apps: [ActivateNow Provisioning, Coastline Billing (Legacy)]
    components: [ActivateNow, Coastline Billing, Batch Job]
    violations: [STD-BSS-01, STD-INT-05, STD-INT-02]
    body: |
      ## Summary
      Reduce failed activations for Coastline subscribers.

      ## Design
      Data classification: activation records are internal.

      ActivateNow will write activation flags into the shared database schema used by Coastline Billing. A nightly batch job will reconcile activation status with the provisioning tables directly.
  - key: usage_api
    title: Real-time Usage in App
    team: Digital Channels
    apps: [Meridian App, ChargeCore OCS, StreamMed 5G Mediation]
    components: [Meridian App, BFF, Balance Query API, Usage Events Stream]
    violations: []
    body: |
      ## Summary
      Show near-real-time data usage and balance in the app.

      ## Design
      Data classification: usage and balance are confidential.

      The BFF calls the Balance Query API through the API gateway with OAuth2 and subscribes to usage events for push notifications. Results are cached for 60 seconds.
  - key: selfheal
    title: Self-Healing RAN Actions
    team: Network Automation
    apps: [AutoHeal Orchestrator, RANManager, FaultWatch FM]
    components: [AutoHeal Agent, Alarm Events, RANManager, Approval Gate]
    violations: [STD-AI-01, STD-AI-02]
    body: |
      ## Summary
      Let an AI agent restart cells and adjust parameters in response to alarms.

      ## Design
      Data classification: network configuration is confidential.

      The agent is built on OpenMind Studio. Actions on more than ten cells go through an approval gate; smaller actions execute automatically with rollback. We will skip the model registry until the pilot is complete.
  - key: credit_explain
    title: Credit Decision Explanations
    team: Sales Operations
    apps: [CreditCheck Activation, OrderFlow OM]
    components: [Scorecard, Explanation Service, OrderFlow]
    violations: []
    body: |
      ## Summary
      Provide reason codes and human review for declined activations.

      ## Design
      Data classification: credit results are restricted.

      Every decline is routed to a credit analyst queue for human review before the customer is notified. Reason codes come from the registered scorecard. APIs are behind the gateway with OAuth2.
  - key: b2b_quotes
    title: B2B Quote Portal
    team: Enterprise Systems
    apps: [QuoteFast CPQ, Nimbus CRM B2B]
    components: [Quote Portal, CPQ, CRM, Pricing Service, Approval Service, Contract Service]
    violations: [STD-NFR-03]
    body: |
      ## Summary
      Let enterprise customers request quotes online.

      ## Design
      Data classification: quotes are internal; enterprise contacts are confidential.

      Each quote request is a synchronous chain: Quote Portal -> CPQ -> Pricing Service -> Approval Service -> Contract Service -> CRM. All calls are blocking REST calls through the gateway with OAuth2.
  - key: residency_lake
    title: Churn Analytics in Vendor Cloud
    team: Customer Analytics
    apps: [PulseAnalytics Hosted, Meridian EDW]
    components: [PulseAnalytics, EDW, Subscriber Marts]
    violations: [STD-RES-01, STD-INT-02]
    body: |
      ## Summary
      Expand PulseAnalytics churn reports to all subscribers.

      ## Design
      Data classification: subscriber marts are confidential.

      PulseAnalytics will use a direct database connection to the EDW subscriber marts and copy results to its analytics region in us-east-1.
  - key: esim_journey
    title: eSIM Activation in App
    team: Digital Channels
    apps: [eSIM Hub, Meridian App, OrderFlow OM]
    components: [Meridian App, OrderFlow, eSIM Hub, Event Broker]
    violations: []
    body: |
      ## Summary
      Allow customers to activate an eSIM end to end in the app.

      ## Design
      Data classification: SIM profiles are restricted; order data is confidential.

      The app submits a TMF622 order through the gateway. OrderFlow orchestrates activation as a saga with events. Customers authenticate with the enterprise identity platform.
  - key: dealer_catalog
    title: Dealer Offer Lookup
    team: Retail Systems
    apps: [DealerNet Portal, Coastline Product Catalog]
    components: [DealerNet, Coastline Catalog]
    violations: [STD-INT-02, STD-TMF-01, STD-DATA-01]
    body: |
      ## Summary
      Show current offers to dealers.

      ## Design
      DealerNet will query the catalog tables directly and expose a custom SOAP interface to partner dealers.
  - key: capacity_forecast
    title: Capacity Forecast Automation
    team: Network Planning
    apps: [PlanAhead Capacity, PerfStat PM]
    components: [PlanAhead, PerfStat, Model Registry]
    violations: []
    body: |
      ## Summary
      Automate weekly capacity forecasts per cell.

      ## Design
      Data classification: KPI counters are internal.

      PlanAhead consumes KPI counters from the PerfStat event stream. The forecast model is registered in ModelHub with an evaluation report. Planners approve all capex recommendations.
  - key: ticket_triage
    title: Ticket Auto-Triage v2
    team: Service Assurance
    apps: [TicketPro TT, FaultWatch FM]
    components: [TicketPro, Triage Classifier, Alarm Events]
    violations: []
    body: |
      ## Summary
      Improve auto-triage accuracy with alarm context.

      ## Design
      Data classification: tickets and alarms are internal.

      The classifier subscribes to alarm events and calls the Trouble Ticket API through the gateway with OAuth2. The model is registered with evaluation. Engineers can override any triage decision.

decisions:
  - key: d1
    channel: "#bss-consolidation"
    title: Retire MedLink by moving all usage to StreamMed
    context: MedLink reaches vendor end of support in six months and only handles legacy 2G/3G/4G CDRs.
    options: [Extend MedLink support, Migrate all usage to StreamMed, Outsource mediation]
    decision: Migrate all usage streams to StreamMed 5G Mediation and retire MedLink.
    consequences: InterBill must consume usage events instead of reading MedLink staging tables.
    apps: [MedLink Mediation (Legacy), StreamMed 5G Mediation, InterBill Interconnect]
  - key: d2
    channel: "#bss-consolidation"
    title: Convergent Billing as the single billing platform
    context: Two billing systems after the merger; every tariff configured twice.
    options: [Keep both, Migrate to Convergent Billing, Migrate to Coastline Billing]
    decision: Migrate Coastline subscribers to Meridian Convergent Billing in four waves.
    consequences: Coastline Billing frozen for changes; migration factory funded.
    apps: [Coastline Billing (Legacy), Meridian Convergent Billing]
  - key: d3
    channel: "#arch-integration"
    title: No more BSS/OSS shared database links
    context: CRM and ActivateNow use shared DB links with OSS/billing that break during upgrades.
    options: [Keep links with change control, Replace with TMF APIs and events, Replicate OSS data into CRM]
    decision: Replace all BSS/OSS shared database links with TMF Open APIs and service events.
    consequences: Care desktop and activation flows re-platformed; links removed within two quarters.
    apps: [Helios CRM Consumer, NetInventory OSS, ActivateNow Provisioning]
  - key: d4
    channel: "#data-governance"
    title: Subscriber data stays in eu-central-1
    context: Some vendor analytics process subscriber data in us-east-1.
    options: [Accept with contractual clauses, Require in-region processing, Anonymise before export]
    decision: Require in-region processing for all subscriber PII; vendors without in-region hosting are exited.
    consequences: PulseAnalytics must move region or be replaced.
    apps: [PulseAnalytics Hosted, Meridian Data Lake]
  - key: d5
    channel: "#digital"
    title: Chatbot escalates to humans for billing disputes
    context: Chatbot containment targets risk unresolved billing disputes.
    options: [Bot resolves all, Escalate disputes, Bot drafts and agent approves]
    decision: Bot drafts the dispute resolution and an agent approves before any credit is issued.
    consequences: Agent queue sizing; disclosure messaging updated.
    apps: [Ask Meri Chatbot, Helios CRM Consumer]
  - key: d6
    channel: "#genai-cop"
    title: Approved GenAI platforms
