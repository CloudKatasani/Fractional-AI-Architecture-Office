extra_standards:
  - id: STD-OT-01
    title: OT systems isolated per NERC CIP
    domain: security
    severity: critical
    rule_text: No direct network or database connection from IT to OT (BES Cyber Systems). Data leaves OT only via the OT DMZ (data diode / historian replica).
    checks:
      - {type: pattern_any, patterns: ["(directly|direct) .{0,40}(scada|ems|adms|historian)", "connect(s)? to the (ot|scada) network"]}
  - id: STD-OT-02
    title: OT change control
    domain: security
    severity: high
    rule_text: Changes to OT systems follow CIP-010 configuration change management with documented baselines.
    checks: []
  - id: STD-INT-04
    title: Event streaming for meter data
    domain: integration
    severity: medium
    rule_text: Meter reads and meter events are consumed from the meter event stream, never by polling or querying MDM storage.
    checks:
      - {type: pattern_any, patterns: ["(query|queries|poll|polls|polling) .{0,40}(mdm|meter data management|interval tables)"]}
  - id: STD-UTL-01
    title: Customer data access via approved data-access API
    domain: api
    severity: medium
    rule_text: Customer energy-usage data shared with customers or authorised third parties goes through the PUC-mandated data-access API with consent records.
    checks: []
  - id: STD-SEC-03
    title: Privileged access to OT requires MFA via jump host
    domain: security
    severity: high
    rule_text: Interactive access to OT assets uses MFA through the approved jump host.
    checks: []

extra_patterns:
  - id: PAT-10
    name: OT/IT DMZ with Data Diode
    when_to_use: Move operational telemetry from OT (SCADA, EMS, historian) to IT analytics without opening inbound paths to OT.
    keywords: [ot, scada, historian, telemetry, grid, substation, nerc, cip, boundary]
    nfrs: [security, compliance]
    components: [OT Historian, Data Diode, DMZ Historian Replica, Event Broker, IT Analytics]
    standard_ids: [STD-OT-01, STD-INT-02]
    diagram_mermaid: |
      flowchart LR
        subgraph OT
          H[(OT Historian)]
        end
        H --> D[/Data Diode/]
        subgraph DMZ
          R[(Historian Replica)]
        end
        D --> R --> B{{Event Broker}} --> A[IT Analytics]

extra_policies:
  - id: POL-10
    title: Meter data retained for 7 years
    rule: Meter data (interval, register, events) must be retained for at least 2555 days.
    regulation: State PUC meter data retention rule
    severity: medium
    check: {type: retention_min, tag: meter_data, days: 2555}
  - id: POL-11
    title: Customer PII retention limit
    rule: Customer personal data may not be retained beyond 1825 days after account closure.
    regulation: State PUC customer data privacy rule
    severity: high
    check: {type: retention_max, pii: true, domains: [Customer, Metering, Outage, DER], days: 1825}
  - id: POL-12
    title: SOX change-controlled financial data
    rule: SOX-scoped datasets must be produced only by approved, scheduled pipelines and retained 7 years.
    regulation: SOX
    severity: high
    check: {type: retention_min, tag: sox, days: 2555}
  - id: POL-13
    title: BES Cyber System Information stays in OT
    rule: BCSI datasets may leave the OT zone only through approved cross-zone pipelines (data diode).
    regulation: NERC CIP
    severity: critical
    check: {type: cross_zone, tag: bcsi}
  - id: POL-14
    title: PII masked in non-production
    rule: Personal data copied to non-production must be masked.
    regulation: State PUC customer data privacy rule
    severity: high
    check: {type: masking_nonprod}
  - id: POL-15
    title: Customer data shared with third parties requires consent
    rule: Customer usage data exported to third parties requires a consent record.
    regulation: State PUC data-access mandate
    severity: medium
    check: {type: owner_required, tag: customer_pii}

