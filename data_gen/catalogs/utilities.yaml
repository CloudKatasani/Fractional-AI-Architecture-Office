strategy_docs:
  - key: grid2030
    title: Grid Modernization 2030
    type: strategy
    year: 2024
    paragraphs:
      - NorthGrid Energy will modernise its distribution grid over the next six years to integrate distributed energy resources, improve reliability and prepare for electrified transport and heating. Customer-sited solar, batteries and EV charging are growing at more than 30% a year in our service territory and the current grid management toolset was not designed for two-way power flows.
      - The programme has three pillars. First, a single advanced distribution management capability with fault location, isolation and service restoration on every feeder by 2028. Second, a DER management platform that can forecast and, where customers have enrolled, dispatch distributed resources. Third, the data foundation that connects metering, GIS and operational telemetry so planners and operators work from the same network model.
      - We will retire point-to-point integrations and direct database links between operational systems, which today account for a disproportionate share of outages during upgrades. Integration with OT systems will follow NERC CIP requirements and pass through the OT DMZ.
      - Success will be measured by SAIDI improvement, the share of feeders with automated restoration, DER hosting capacity published to customers, and the time taken to process interconnection requests.
  - key: wildfire
    title: Wildfire Mitigation Plan
    type: regulatory_mandate
    year: 2025
    paragraphs:
      - The Wildfire Mitigation Plan responds to the state regulator's requirement that every electric utility with assets in high fire-threat districts maintain an approved, data-driven mitigation plan. Approximately 18% of NorthGrid's overhead distribution miles cross elevated or extreme fire-threat areas.
      - The plan commits to risk-based vegetation management, covered conductor in the highest-risk segments, situational awareness through weather stations and cameras, and a public safety power shutoff (PSPS) protocol with clear customer communications.
      - We will move vegetation management from fixed trim cycles to risk-scored work driven by imagery, weather and asset condition. A wildfire risk model will score every circuit segment daily during fire season and drive inspection and trimming priorities.
      - The regulator expects annual reporting on risk reduction per dollar spent, inspection completion, and PSPS events. Funding for the risk model and imagery analytics has not yet been secured in the capital plan.
  - key: cx
    title: Customer Experience Transformation
    type: strategy
    year: 2024
    paragraphs:
      - Customers expect the same digital service from their utility that they get from their bank. Today 61% of contacts still arrive by phone, outage updates are inconsistent between channels, and customers cannot see their interval usage in the mobile app.
      - The transformation will deliver a single customer API layer in front of the customer information system so the portal, mobile app, IVR and contact center share the same data and rules. We will add proactive outage notifications, usage insights and paperless billing by default.
      - We will reduce cost to serve by 15% while improving customer satisfaction scores in the regulator's annual survey. Any use of artificial intelligence in customer-facing channels will follow the model risk standard and disclose AI use to customers.
      - Key measures are digital adoption, first contact resolution, outage notification accuracy and J.D. Power-style satisfaction scores.
  - key: decarb
    title: Decarbonization and DER Integration
    type: strategy
    year: 2025
    paragraphs:
      - NorthGrid has committed to net-zero Scope 1 and 2 emissions by 2045 and to supporting customers' own decarbonisation. This requires integrating rooftop solar, community solar, storage and managed EV charging at scale.
      - We will expand demand response and time-of-use programmes, offer managed charging to EV owners, and publish hosting capacity maps. DER forecasting will feed both grid operations and energy trading.
      - The interconnection process must fall from an average of 74 days to under 30 days for small systems, which requires automated screening against the network model.
  - key: okrs
    title: FY2026 Enterprise OKRs
    type: OKR
    year: 2026
    paragraphs:
      - "Objective 1: Keep the lights on safely. Key results: SAIDI below 95 minutes; zero utility-caused ignitions; 100% of high fire-threat circuits risk-scored daily in season."
      - "Objective 2: Make it easy to be our customer. Key results: digital adoption 55%; outage notification accuracy 90%; customer usage visible in app."
      - "Objective 3: Spend every dollar wisely. Key results: reduce application portfolio run cost by 8%; retire three end-of-support platforms; 90% of project spend linked to a strategic goal."
      - "Objective 4: Prepare for the grid of 2030. Key results: ADMS FLISR on 60% of feeders; DER registry complete; interconnection under 45 days."
  - key: board_ai
    title: Board Paper — Responsible Adoption of AI
    type: board_paper
    year: 2026
    paragraphs:
      - This paper asks the Board to endorse a responsible AI framework for NorthGrid. AI use is already widespread but uncoordinated - business units are piloting generative AI tools, several paid for through expense reports, and some models in production have not been formally evaluated.
      - We propose a single AI use-case intake, risk tiering modelled on the EU AI Act categories, a register of all models and AI tools, and mandatory human oversight for any AI that affects customers' bills or safety of grid operations.
      - Covert monitoring of employees and fully automated decisions affecting customers' tariffs will not be permitted. Safety-relevant AI in the control room will be treated as high risk and require validation before use.
  - key: puc_access
    title: PUC Order — Customer Data Access Mandate
    type: regulatory_mandate
    year: 2025
    paragraphs:
      - The state Public Utilities Commission has ordered all investor-owned utilities to provide customers and their authorised third parties with machine-readable access to interval usage and billing data within 18 months.
      - Utilities must implement a standards-based data-access API, a consent management process with revocation, and annual reporting of third-party access requests. Customer personal data shared under the order is subject to the PUC customer data privacy rule.
      - Non-compliance may result in penalties and will be considered in the next general rate case.

